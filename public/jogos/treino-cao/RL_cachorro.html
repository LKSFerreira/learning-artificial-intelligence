<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferência por Ação (Política do Agente) — Cão 3D AAA (Sem Coleira)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Three.js r128 Core + GLTFLoader + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #070a13;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        #dog-canvas-container {
            width: 100%;
            height: 100%;
            min-height: 380px;
        }
    </style>
</head>
<body class="min-h-screen bg-[#070a13] flex flex-col justify-between items-center p-4 sm:p-6 md:p-8 select-none">

    <!-- Central Area: Ultra-Realistic 3D Animated Dog Viewport -->
    <div class="flex-1 w-full max-w-5xl flex flex-col items-center justify-center relative my-auto min-h-[380px] sm:min-h-[440px]">
        <div id="dog-canvas-container" class="relative w-full h-full flex items-center justify-center">
            <!-- Three.js WebGL Canvas inserted dynamically here -->
            <div id="model-status-badge" class="absolute top-4 right-4 bg-[#0b101d]/80 border border-[#1b253e] text-xs text-slate-400 px-3 py-1.5 rounded-full backdrop-blur-md flex items-center gap-2 shadow-lg">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="badge-text">Motor 3D: Cão Caramelo 100% Pelado (Sem Coleira)</span>
            </div>
        </div>
    </div>

    <!-- Bottom Panel Container -->
    <div class="w-full max-w-6xl flex flex-col gap-5 mt-auto">
        
        <!-- Top Section: Agent Policy Probabilities Box -->
        <div class="bg-[#0b101d] border border-[#172036] rounded-xl p-4 sm:p-5 shadow-2xl">
            <!-- Header Row -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 mb-4">
                <h2 class="text-xs sm:text-sm font-bold text-slate-300 tracking-wider uppercase">
                    PREFERÊNCIA POR AÇÃO (POLÍTICA DO AGENTE)
                </h2>
                <span class="text-[11px] sm:text-xs text-slate-500 font-normal">
                    Valores aproximam a distribuição de probabilidades
                </span>
            </div>

            <!-- 5 Action Probability Cards Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                
                <!-- Action 1: Sentar -->
                <div class="bg-[#0f1525] border border-[#1b253e] rounded-lg p-3 flex flex-col justify-between gap-2.5">
                    <div class="flex items-center justify-between text-xs sm:text-sm">
                        <span class="font-semibold text-slate-200" id="label-sentar">Sentar</span>
                        <span class="font-bold text-slate-300 text-xs" id="val-sentar">20%</span>
                    </div>
                    <div class="w-full bg-[#182138] h-2 rounded-full overflow-hidden">
                        <div id="bar-sentar" class="bg-[#584de3] h-full rounded-full transition-all duration-300 ease-out" style="width: 20%;"></div>
                    </div>
                </div>

                <!-- Action 2: Pular -->
                <div class="bg-[#0f1525] border border-[#1b253e] rounded-lg p-3 flex flex-col justify-between gap-2.5">
                    <div class="flex items-center justify-between text-xs sm:text-sm">
                        <span class="font-semibold text-slate-200" id="label-pular">Pular</span>
                        <span class="font-bold text-slate-300 text-xs" id="val-pular">20%</span>
                    </div>
                    <div class="w-full bg-[#182138] h-2 rounded-full overflow-hidden">
                        <div id="bar-pular" class="bg-[#584de3] h-full rounded-full transition-all duration-300 ease-out" style="width: 20%;"></div>
                    </div>
                </div>

                <!-- Action 3: Latir -->
                <div class="bg-[#0f1525] border border-[#1b253e] rounded-lg p-3 flex flex-col justify-between gap-2.5">
                    <div class="flex items-center justify-between text-xs sm:text-sm">
                        <span class="font-semibold text-slate-200" id="label-latir">Latir</span>
                        <span class="font-bold text-slate-300 text-xs" id="val-latir">20%</span>
                    </div>
                    <div class="w-full bg-[#182138] h-2 rounded-full overflow-hidden">
                        <div id="bar-latir" class="bg-[#584de3] h-full rounded-full transition-all duration-300 ease-out" style="width: 20%;"></div>
                    </div>
                </div>

                <!-- Action 4: Deitar -->
                <div class="bg-[#0f1525] border border-[#1b253e] rounded-lg p-3 flex flex-col justify-between gap-2.5">
                    <div class="flex items-center justify-between text-xs sm:text-sm">
                        <span class="font-semibold text-slate-200" id="label-deitar">Deitar</span>
                        <span class="font-bold text-slate-300 text-xs" id="val-deitar">20%</span>
                    </div>
                    <div class="w-full bg-[#182138] h-2 rounded-full overflow-hidden">
                        <div id="bar-deitar" class="bg-[#584de3] h-full rounded-full transition-all duration-300 ease-out" style="width: 20%;"></div>
                    </div>
                </div>

                <!-- Action 5: Girar -->
                <div class="bg-[#0f1525] border border-[#1b253e] rounded-lg p-3 flex flex-col justify-between gap-2.5">
                    <div class="flex items-center justify-between text-xs sm:text-sm">
                        <span class="font-semibold text-slate-200" id="label-girar">Girar</span>
                        <span class="font-bold text-slate-300 text-xs" id="val-girar">20%</span>
                    </div>
                    <div class="w-full bg-[#182138] h-2 rounded-full overflow-hidden">
                        <div id="bar-girar" class="bg-[#584de3] h-full rounded-full transition-all duration-300 ease-out" style="width: 20%;"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Bottom Section: Command Selection -->
        <div class="flex flex-col gap-3 mt-1">
            
            <!-- Label with Sparkle Icon -->
            <div class="flex items-center gap-2 text-amber-400 font-bold text-sm sm:text-base">
                <svg class="w-4 h-4 sm:w-5 sm:h-5 fill-current text-amber-400" viewBox="0 0 24 24">
                    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
                </svg>
                <span>Selecione o Comando para o Cão:</span>
            </div>

            <!-- 5 Command Action Buttons -->
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                <button id="btn-sentar" onclick="selectCommand('sentar')" class="btn-command bg-[#5547e8] hover:bg-[#483ad3] active:scale-[0.98] text-white font-bold py-3.5 px-6 rounded-2xl transition-all duration-150 text-center text-sm sm:text-base shadow-lg shadow-[#5547e8]/20">
                    Sentar
                </button>
                <button id="btn-pular" onclick="selectCommand('pular')" class="btn-command bg-[#5547e8] hover:bg-[#483ad3] active:scale-[0.98] text-white font-bold py-3.5 px-6 rounded-2xl transition-all duration-150 text-center text-sm sm:text-base shadow-lg shadow-[#5547e8]/20">
                    Pular
                </button>
                <button id="btn-latir" onclick="selectCommand('latir')" class="btn-command bg-[#5547e8] hover:bg-[#483ad3] active:scale-[0.98] text-white font-bold py-3.5 px-6 rounded-2xl transition-all duration-150 text-center text-sm sm:text-base shadow-lg shadow-[#5547e8]/20">
                    Latir
                </button>
                <button id="btn-deitar" onclick="selectCommand('deitar')" class="btn-command bg-[#5547e8] hover:bg-[#483ad3] active:scale-[0.98] text-white font-bold py-3.5 px-6 rounded-2xl transition-all duration-150 text-center text-sm sm:text-base shadow-lg shadow-[#5547e8]/20">
                    Deitar
                </button>
                <button id="btn-girar" onclick="selectCommand('girar')" class="btn-command bg-[#5547e8] hover:bg-[#483ad3] active:scale-[0.98] text-white font-bold py-3.5 px-6 rounded-2xl transition-all duration-150 text-center text-sm sm:text-base shadow-lg shadow-[#5547e8]/20">
                    Girar
                </button>
            </div>

        </div>

    </div>

    <script>
        // Global UI state
        let selectedAction = null;

        function selectCommand(actionKey) {
            const actions = ['sentar', 'pular', 'latir', 'deitar', 'girar'];

            if (selectedAction === actionKey) {
                selectedAction = null;
                actions.forEach(act => updateProbabilityBar(act, 20));
                setDogPose('idle');
            } else {
                selectedAction = actionKey;
                actions.forEach(act => {
                    updateProbabilityBar(act, act === actionKey ? 60 : 10);
                });
                setDogPose(actionKey);
            }
        }

        function updateProbabilityBar(actionKey, percent) {
            const valElem = document.getElementById(`val-${actionKey}`);
            const barElem = document.getElementById(`bar-${actionKey}`);
            
            if (valElem && barElem) {
                valElem.textContent = `${percent}%`;
                barElem.style.width = `${percent}%`;
            }
        }

        /* =========================================================================
           ADVANCED 3D ARCHITECTURE (STRICTLY NO COLLAR / BARE NECK ONLY)
           ========================================================================= */

        let scene, camera, renderer, controls;
        let clock = new THREE.Clock();

        let gltfModel = null;
        let animationMixer = null;
        let animationActions = {};
        let activeGLTFAction = null;

        let dogSkeleton = null;
        let dogSkinnedMesh = null;
        let bones = {};

        let currentPoseState = 'idle';
        let spinYawTarget = 0;
        let spinYawCurrent = 0;
        const DOG_BASE_YAW = 0.45;

        let targetRig = {
            pelvisPosY: 0.72, pelvisPosZ: 0, pelvisRotX: 0, pelvisRotZ: 0,
            spine1RotX: 0, spine2RotX: 0,
            neckRotX: 0, neckRotY: 0,
            headRotX: 0, headRotY: 0, headRotZ: 0,
            jawRotX: 0.05,
            
            footFL: { x: -0.20, y: 0.05, z: 0.15 },
            footFR: { x:  0.20, y: 0.05, z: 0.15 },
            footBL: { x: -0.22, y: 0.05, z: -0.48 },
            footBR: { x:  0.22, y: 0.05, z: -0.48 },

            tailWagSpeed: 10, tailAmp: 0.25
        };

        let currentRig = JSON.parse(JSON.stringify(targetRig));

        function init3DScene() {
            const container = document.getElementById('dog-canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(34, width / height, 0.1, 100);
            camera.position.set(1.6, 1.25, 2.95);
            camera.lookAt(0, 0.82, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;

            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.05;
            controls.minDistance = 1.5;
            controls.maxDistance = 6.0;
            controls.target.set(0, 0.82, 0);

            setupStudioLighting();
            buildProceduralSkinnedDogRig();

            window.addEventListener('resize', onWindowResize);
        }

        function setupStudioLighting() {
            const ambientLight = new THREE.AmbientLight(0xfff6ed, 1.3);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xfffaee, 2.4);
            keyLight.position.set(3.2, 5.5, 3.8);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 0.5;
            keyLight.shadow.camera.far = 12;
            keyLight.shadow.bias = -0.0001;
            keyLight.shadow.radius = 3.2;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x90b4f8, 0.95);
            fillLight.position.set(-3.8, 3.2, 2.2);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xffc270, 2.0);
            rimLight.position.set(-1.8, 3.8, -3.8);
            scene.add(rimLight);

            const floorGeo = new THREE.PlaneGeometry(12, 12);
            const floorMat = new THREE.ShadowMaterial({ opacity: 0.42 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        function buildProceduralSkinnedDogRig() {
            const dogGroup = new THREE.Group();
            dogGroup.rotation.y = DOG_BASE_YAW;
            scene.add(dogGroup);

            const pelvisBone = new THREE.Bone();
            pelvisBone.position.set(0, 0.72, -0.2);

            const spine1Bone = new THREE.Bone();
            spine1Bone.position.set(0, 0.05, 0.22);
            pelvisBone.add(spine1Bone);

            const spine2Bone = new THREE.Bone();
            spine2Bone.position.set(0, 0.05, 0.22);
            spine1Bone.add(spine2Bone);

            const neckBone = new THREE.Bone();
            neckBone.position.set(0, 0.2, 0.15);
            spine2Bone.add(neckBone);

            const headBone = new THREE.Bone();
            headBone.position.set(0, 0.22, 0.12);
            neckBone.add(headBone);

            const jawBone = new THREE.Bone();
            jawBone.position.set(0, -0.12, 0.12);
            headBone.add(jawBone);

            const earLBone = new THREE.Bone();
            earLBone.position.set(-0.32, 0.12, -0.02);
            headBone.add(earLBone);

            const earRBone = new THREE.Bone();
            earRBone.position.set(0.32, 0.12, -0.02);
            headBone.add(earRBone);

            const tail1Bone = new THREE.Bone();
            tail1Bone.position.set(0, 0.08, -0.28);
            pelvisBone.add(tail1Bone);

            const tail2Bone = new THREE.Bone();
            tail2Bone.position.set(0, 0.12, -0.15);
            tail1Bone.add(tail2Bone);

            const tail3Bone = new THREE.Bone();
            tail3Bone.position.set(0, 0.12, -0.12);
            tail2Bone.add(tail3Bone);

            const createLegBones = (posX, posZ, isFront) => {
                const hipBone = new THREE.Bone();
                hipBone.position.set(posX, 0.0, posZ);

                const kneeBone = new THREE.Bone();
                kneeBone.position.set(0, -0.32, isFront ? 0.02 : -0.05);
                hipBone.add(kneeBone);

                const ankleBone = new THREE.Bone();
                ankleBone.position.set(0, -0.32, isFront ? -0.02 : 0.05);
                kneeBone.add(ankleBone);

                const footBone = new THREE.Bone();
                footBone.position.set(0, -0.06, 0.04);
                ankleBone.add(footBone);

                return { hipBone, kneeBone, ankleBone, footBone };
            };

            const legFL = createLegBones(-0.20, 0.32, true);
            const legFR = createLegBones( 0.20, 0.32, true);
            const legBL = createLegBones(-0.22, -0.15, false);
            const legBR = createLegBones( 0.22, -0.15, false);

            spine2Bone.add(legFL.hipBone);
            spine2Bone.add(legFR.hipBone);
            pelvisBone.add(legBL.hipBone);
            pelvisBone.add(legBR.hipBone);

            dogGroup.add(pelvisBone);

            bones = {
                pelvis: pelvisBone,
                spine1: spine1Bone,
                spine2: spine2Bone,
                neck: neckBone,
                head: headBone,
                jaw: jawBone,
                earL: earLBone,
                earR: earRBone,
                tail1: tail1Bone,
                tail2: tail2Bone,
                tail3: tail3Bone,
                legFL, legFR, legBL, legBR
            };

            const allBones = [
                pelvisBone, spine1Bone, spine2Bone, neckBone, headBone, jawBone, earLBone, earRBone,
                tail1Bone, tail2Bone, tail3Bone,
                legFL.hipBone, legFL.kneeBone, legFL.ankleBone, legFL.footBone,
                legFR.hipBone, legFR.kneeBone, legFR.ankleBone, legFR.footBone,
                legBL.hipBone, legBL.kneeBone, legBL.ankleBone, legBL.footBone,
                legBR.hipBone, legBR.kneeBone, legBR.ankleBone, legBR.footBone
            ];

            dogSkeleton = new THREE.Skeleton(allBones);

            const matFurMain = new THREE.MeshStandardMaterial({
                color: 0xe09843,
                roughness: 0.76,
                metalness: 0.0,
                skinning: true
            });

            const matFurCream = new THREE.MeshStandardMaterial({
                color: 0xfff0db,
                roughness: 0.8,
                metalness: 0.0,
                skinning: true
            });

            const matDarkEar = new THREE.MeshStandardMaterial({
                color: 0x9e5723,
                roughness: 0.8,
                metalness: 0.0,
                skinning: true
            });

            const bodyGeo = new THREE.CylinderGeometry(0.38, 0.36, 1.1, 24, 16);
            bodyGeo.rotateX(Math.PI / 2);
            bodyGeo.translate(0, 0.76, -0.1);

            const position = bodyGeo.attributes.position;
            const skinIndices = [];
            const skinWeights = [];

            for (let i = 0; i < position.count; i++) {
                const z = position.getZ(i);
                if (z < -0.3) {
                    skinIndices.push(0, 1, 0, 0);
                    skinWeights.push(0.85, 0.15, 0, 0);
                } else if (z < 0.1) {
                    skinIndices.push(1, 2, 0, 0);
                    skinWeights.push(0.6, 0.4, 0, 0);
                } else {
                    skinIndices.push(2, 3, 0, 0);
                    skinWeights.push(0.7, 0.3, 0, 0);
                }
            }

            bodyGeo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
            bodyGeo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));

            dogSkinnedMesh = new THREE.SkinnedMesh(bodyGeo, matFurMain);
            dogSkinnedMesh.add(pelvisBone);
            dogSkinnedMesh.bind(dogSkeleton);
            dogSkinnedMesh.castShadow = true;
            dogSkinnedMesh.receiveShadow = true;
            dogGroup.add(dogSkinnedMesh);

            // Head & Details WITHOUT ANY COLLAR MESH
            buildHeadAndDetails(headBone, jawBone, earLBone, earRBone, matFurMain, matFurCream, matDarkEar);
        }

        function buildHeadAndDetails(headBone, jawBone, earLBone, earRBone, matFurMain, matFurCream, matDarkEar) {
            const headGeo = new THREE.SphereGeometry(0.38, 32, 32);
            headGeo.scale(1.02, 0.98, 0.98);
            const headMesh = new THREE.Mesh(headGeo, matFurMain);
            headMesh.castShadow = true;
            headBone.add(headMesh);

            const cheekGeo = new THREE.SphereGeometry(0.2, 20, 20);
            const cheekL = new THREE.Mesh(cheekGeo, matFurMain);
            cheekL.position.set(-0.2, -0.08, 0.12);
            headBone.add(cheekL);

            const cheekR = new THREE.Mesh(cheekGeo, matFurMain);
            cheekR.position.set(0.2, -0.08, 0.12);
            headBone.add(cheekR);

            const blushGeo = new THREE.SphereGeometry(0.065, 16, 16);
            blushGeo.scale(1.2, 0.5, 0.4);
            const matBlush = new THREE.MeshStandardMaterial({ color: 0xff8a9e, roughness: 0.8, transparent: true, opacity: 0.65 });
            const blushL = new THREE.Mesh(blushGeo, matBlush);
            blushL.position.set(-0.25, -0.04, 0.28);
            blushL.rotation.z = -0.15;
            headBone.add(blushL);

            const blushR = new THREE.Mesh(blushGeo, matBlush);
            blushR.position.set(0.25, -0.04, 0.28);
            blushR.rotation.z = 0.15;
            headBone.add(blushR);

            const browGeo = new THREE.SphereGeometry(0.07, 16, 16);
            browGeo.scale(1.2, 0.65, 0.5);
            const browL = new THREE.Mesh(browGeo, matFurCream);
            browL.position.set(-0.14, 0.19, 0.33);
            browL.rotation.z = -0.12;
            headBone.add(browL);

            const browR = new THREE.Mesh(browGeo, matFurCream);
            browR.position.set(0.14, 0.19, 0.33);
            browR.rotation.z = 0.12;
            headBone.add(browR);

            const snoutGeo = new THREE.SphereGeometry(0.22, 28, 28);
            snoutGeo.scale(1.05, 0.78, 1.15);
            const snoutMesh = new THREE.Mesh(snoutGeo, matFurCream);
            snoutMesh.position.set(0, -0.08, 0.32);
            snoutMesh.castShadow = true;
            headBone.add(snoutMesh);

            const matNose = new THREE.MeshStandardMaterial({ color: 0x181210, roughness: 0.2, metalness: 0.05 });
            const noseGeo = new THREE.SphereGeometry(0.065, 20, 20);
            noseGeo.scale(1.25, 0.85, 0.95);
            const noseMesh = new THREE.Mesh(noseGeo, matNose);
            noseMesh.position.set(0, -0.01, 0.56);
            headBone.add(noseMesh);

            const jawGeo = new THREE.SphereGeometry(0.15, 24, 24);
            jawGeo.scale(0.95, 0.45, 1.0);
            const jawMesh = new THREE.Mesh(jawGeo, matFurCream);
            jawMesh.position.set(0, -0.02, 0.12);
            jawBone.add(jawMesh);

            const matTongue = new THREE.MeshStandardMaterial({ color: 0xff7090, roughness: 0.35 });
            const tongueGeo = new THREE.BoxGeometry(0.09, 0.018, 0.16);
            const tongueMesh = new THREE.Mesh(tongueGeo, matTongue);
            tongueMesh.position.set(0, 0.005, 0.16);
            tongueMesh.rotation.x = 0.15;
            jawBone.add(tongueMesh);

            const matEyePupil = new THREE.MeshBasicMaterial({ color: 0x0c0603 });
            const matEyeIris = new THREE.MeshStandardMaterial({ color: 0x3d200e, roughness: 0.15 });

            const createEye = (posX) => {
                const eyeGroup = new THREE.Group();
                eyeGroup.position.set(posX, 0.07, 0.32);

                const eyeBaseGeo = new THREE.SphereGeometry(0.085, 24, 24);
                eyeBaseGeo.scale(1.0, 1.08, 0.7);
                const eyeBaseMesh = new THREE.Mesh(eyeBaseGeo, matEyePupil);

                const irisGeo = new THREE.SphereGeometry(0.068, 20, 20);
                irisGeo.scale(1.0, 1.05, 0.3);
                const irisMesh = new THREE.Mesh(irisGeo, matEyeIris);
                irisMesh.position.z = 0.025;

                const catchlight1Geo = new THREE.SphereGeometry(0.024, 16, 16);
                const catchlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const catchlight1 = new THREE.Mesh(catchlight1Geo, catchlightMat);
                catchlight1.position.set(posX > 0 ? 0.022 : -0.012, 0.025, 0.052);

                const catchlight2Geo = new THREE.SphereGeometry(0.012, 12, 12);
                const catchlight2 = new THREE.Mesh(catchlight2Geo, catchlightMat);
                catchlight2.position.set(posX > 0 ? -0.022 : 0.022, -0.025, 0.05);

                eyeGroup.add(eyeBaseMesh);
                eyeGroup.add(irisMesh);
                eyeGroup.add(catchlight1);
                eyeGroup.add(catchlight2);
                return eyeGroup;
            };

            headBone.add(createEye(-0.16));
            headBone.add(createEye(0.16));

            const earGeo = new THREE.SphereGeometry(0.16, 24, 24);
            earGeo.scale(0.55, 1.35, 0.85);

            const earLMesh = new THREE.Mesh(earGeo, matDarkEar);
            earLMesh.position.set(0, -0.18, 0);
            earLMesh.castShadow = true;
            earLBone.add(earLMesh);

            const earRMesh = new THREE.Mesh(earGeo, matDarkEar);
            earRMesh.position.set(0, -0.18, 0);
            earRMesh.castShadow = true;
            earRBone.add(earRMesh);
        }

        function setDogPose(poseName) {
            currentPoseState = poseName;

            switch (poseName) {
                case 'sentar':
                    targetRig.pelvisPosY = 0.42;
                    targetRig.pelvisPosZ = -0.18;
                    targetRig.pelvisRotX = -0.65;
                    targetRig.spine1RotX = 0.35;
                    targetRig.spine2RotX = 0.25;
                    targetRig.neckRotX = 0.25;
                    targetRig.headRotX = -0.15;
                    targetRig.jawRotX = 0.18;

                    targetRig.footFL = { x: -0.20, y: 0.05, z: 0.15 };
                    targetRig.footFR = { x:  0.20, y: 0.05, z: 0.15 };
                    targetRig.footBL = { x: -0.24, y: 0.05, z: -0.32 };
                    targetRig.footBR = { x:  0.24, y: 0.05, z: -0.32 };
                    targetRig.tailWagSpeed = 18;
                    targetRig.tailAmp = 0.45;
                    break;

                case 'pular':
                    targetRig.pelvisPosY = 1.05;
                    targetRig.pelvisPosZ = 0.15;
                    targetRig.pelvisRotX = 0.45;
                    targetRig.spine1RotX = -0.25;
                    targetRig.spine2RotX = -0.15;
                    targetRig.neckRotX = -0.18;
                    targetRig.headRotX = 0.12;
                    targetRig.jawRotX = 0.45;

                    targetRig.footFL = { x: -0.22, y: 0.55, z: 0.35 };
                    targetRig.footFR = { x:  0.22, y: 0.65, z: 0.38 };
                    targetRig.footBL = { x: -0.22, y: 0.25, z: -0.45 };
                    targetRig.footBR = { x:  0.22, y: 0.25, z: -0.45 };
                    targetRig.tailWagSpeed = 26;
                    targetRig.tailAmp = 0.75;
                    break;

                case 'latir':
                    targetRig.pelvisPosY = 0.75;
                    targetRig.pelvisPosZ = 0.02;
                    targetRig.pelvisRotX = 0.08;
                    targetRig.spine1RotX = -0.05;
                    targetRig.spine2RotX = 0.12;
                    targetRig.neckRotX = 0.22;
                    targetRig.headRotX = -0.28;
                    targetRig.jawRotX = 0.65;

                    targetRig.footFL = { x: -0.22, y: 0.05, z: 0.22 };
                    targetRig.footFR = { x:  0.20, y: 0.05, z: 0.12 };
                    targetRig.footBL = { x: -0.22, y: 0.05, z: -0.48 };
                    targetRig.footBR = { x:  0.22, y: 0.05, z: -0.48 };
                    targetRig.tailWagSpeed = 22;
                    targetRig.tailAmp = 0.60;
                    break;

                case 'deitar':
                    targetRig.pelvisPosY = 0.32;
                    targetRig.pelvisPosZ = 0.05;
                    targetRig.pelvisRotX = 0.04;
                    targetRig.spine1RotX = 0.02;
                    targetRig.spine2RotX = 0.02;
                    targetRig.neckRotX = 0.12;
                    targetRig.headRotX = -0.08;
                    targetRig.jawRotX = 0.05;

                    targetRig.footFL = { x: -0.24, y: 0.05, z: 0.38 };
                    targetRig.footFR = { x:  0.24, y: 0.05, z: 0.38 };
                    targetRig.footBL = { x: -0.28, y: 0.05, z: -0.52 };
                    targetRig.footBR = { x:  0.28, y: 0.05, z: -0.52 };
                    targetRig.tailWagSpeed = 6;
                    targetRig.tailAmp = 0.18;
                    break;

                case 'girar':
                    spinYawTarget += Math.PI * 2;
                    targetRig.pelvisPosY = 0.74;
                    targetRig.pelvisPosZ = 0;
                    targetRig.pelvisRotX = 0.05;
                    targetRig.spine1RotX = 0.02;
                    targetRig.spine2RotX = 0.08;
                    targetRig.neckRotX = 0.08;
                    targetRig.headRotX = -0.05;
                    targetRig.jawRotX = 0.15;

                    targetRig.footFL = { x: -0.20, y: 0.08, z: 0.18 };
                    targetRig.footFR = { x:  0.20, y: 0.05, z: 0.12 };
                    targetRig.footBL = { x: -0.22, y: 0.05, z: -0.45 };
                    targetRig.footBR = { x:  0.22, y: 0.08, z: -0.48 };
                    targetRig.tailWagSpeed = 20;
                    targetRig.tailAmp = 0.65;
                    break;

                case 'idle':
                default:
                    targetRig.pelvisPosY = 0.72;
                    targetRig.pelvisPosZ = 0;
                    targetRig.pelvisRotX = 0.02;
                    targetRig.spine1RotX = 0.02;
                    targetRig.spine2RotX = 0.02;
                    targetRig.neckRotX = 0.05;
                    targetRig.headRotX = -0.05;
                    targetRig.jawRotX = 0.06;

                    targetRig.footFL = { x: -0.20, y: 0.05, z: 0.15 };
                    targetRig.footFR = { x:  0.20, y: 0.05, z: 0.15 };
                    targetRig.footBL = { x: -0.22, y: 0.05, z: -0.48 };
                    targetRig.footBR = { x:  0.22, y: 0.05, z: -0.48 };
                    targetRig.tailWagSpeed = 10;
                    targetRig.tailAmp = 0.25;
                    break;
            }
        }

        function solveTwoBoneIK(leg, targetPos, isFront) {
            if (!leg || !leg.hipBone || !leg.kneeBone || !leg.ankleBone) return;

            const l1 = 0.32;
            const l2 = 0.32;

            const dx = targetPos.x - leg.hipBone.position.x;
            const dy = targetPos.y - leg.hipBone.position.y;
            const dz = targetPos.z - leg.hipBone.position.z;
            const dist = Math.min(Math.sqrt(dx * dx + dy * dy + dz * dz), l1 + l2 - 0.02);

            const cosKnee = (l1 * l1 + l2 * l2 - dist * dist) / (2 * l1 * l2);
            const kneeAngle = Math.acos(Math.max(-1, Math.min(1, cosKnee)));

            const cosHip = (l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist);
            const hipAngle = Math.acos(Math.max(-1, Math.min(1, cosHip)));
            const targetPitch = Math.atan2(-dz, -dy);

            leg.hipBone.rotation.x = isFront ? (targetPitch - hipAngle) : (targetPitch + hipAngle);
            leg.kneeBone.rotation.x = isFront ? (Math.PI - kneeAngle) : -(Math.PI - kneeAngle);
            leg.ankleBone.rotation.x = -leg.hipBone.rotation.x - leg.kneeBone.rotation.x;
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (bones.pelvis) {
                const lerpSpd = 0.08;
                currentRig.pelvisPosY += (targetRig.pelvisPosY - currentRig.pelvisPosY) * lerpSpd;
                currentRig.pelvisPosZ += (targetRig.pelvisPosZ - currentRig.pelvisPosZ) * lerpSpd;
                currentRig.pelvisRotX += (targetRig.pelvisRotX - currentRig.pelvisRotX) * lerpSpd;
                currentRig.spine1RotX += (targetRig.spine1RotX - currentRig.spine1RotX) * lerpSpd;
                currentRig.spine2RotX += (targetRig.spine2RotX - currentRig.spine2RotX) * lerpSpd;
                currentRig.neckRotX   += (targetRig.neckRotX   - currentRig.neckRotX) * lerpSpd;
                currentRig.headRotX   += (targetRig.headRotX   - currentRig.headRotX) * lerpSpd;
                currentRig.jawRotX    += (targetRig.jawRotX    - currentRig.jawRotX) * lerpSpd;
                currentRig.tailAmp    += (targetRig.tailAmp    - currentRig.tailAmp) * lerpSpd;

                const breath = Math.sin(elapsedTime * 2.6) * 0.018;
                const headTilt = Math.sin(elapsedTime * 0.8) * 0.02;

                bones.pelvis.position.y = currentRig.pelvisPosY + breath;
                bones.pelvis.position.z = currentRig.pelvisPosZ;
                bones.pelvis.rotation.x = currentRig.pelvisRotX;

                bones.spine1.rotation.x = currentRig.spine1RotX + breath * 0.4;
                bones.spine2.rotation.x = currentRig.spine2RotX;
                bones.neck.rotation.x   = currentRig.neckRotX;
                bones.head.rotation.x   = currentRig.headRotX;
                bones.head.rotation.z   = headTilt;

                const panting = (currentPoseState === 'pular' || currentPoseState === 'latir')
                    ? Math.sin(elapsedTime * 14) * 0.08 
                    : Math.sin(elapsedTime * 2.2) * 0.01;
                bones.jaw.rotation.x = currentRig.jawRotX + panting;

                solveTwoBoneIK(bones.legFL, targetRig.footFL, true);
                solveTwoBoneIK(bones.legFR, targetRig.footFR, true);
                solveTwoBoneIK(bones.legBL, targetRig.footBL, false);
                solveTwoBoneIK(bones.legBR, targetRig.footBR, false);

                if (bones.tail1 && bones.tail2 && bones.tail3) {
                    const tailWag1 = Math.sin(elapsedTime * targetRig.tailWagSpeed) * currentRig.tailAmp;
                    const tailWag2 = Math.sin(elapsedTime * targetRig.tailWagSpeed - 0.4) * currentRig.tailAmp * 0.7;
                    const tailWag3 = Math.sin(elapsedTime * targetRig.tailWagSpeed - 0.8) * currentRig.tailAmp * 0.8;

                    bones.tail1.rotation.y = tailWag1;
                    bones.tail2.rotation.y = tailWag2;
                    bones.tail3.rotation.y = tailWag3;
                }

                const earGoalL = 0.32 + Math.sin(elapsedTime * 1.8) * 0.04;
                const earGoalR = -0.32 - Math.sin(elapsedTime * 1.8) * 0.04;
                bones.earL.rotation.z = earGoalL;
                bones.earR.rotation.z = earGoalR;
            }

            spinYawCurrent += (spinYawTarget - spinYawCurrent) * 0.045;
            if (scene.children.length > 0) {
                const dogMaster = scene.children.find(c => c.isGroup);
                if (dogMaster) {
                    dogMaster.rotation.y = DOG_BASE_YAW + spinYawCurrent;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('dog-canvas-container');
            if (!container || !renderer || !camera) return;

            const width = container.clientWidth;
            const height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        window.onload = function() {
            init3DScene();
            animate();
        };
    </script>
